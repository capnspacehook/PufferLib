[base]
env_name = impulse_wars
checkpoint_interval = 100

[policy]
hidden_size = 512
num_layers = 4

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 20
num_policies = 2

hist_policy_hidden_size = 512
hist_policy_num_layers = 4
hist_policy_percent = 0.066

[selfplay]
enabled = 1
max_size = 100
seed = 42
opp_timeout_steps = 10000000
eval_pool_size = 8
eval_games = 0
eval_bot_games = 40960
# sitting duck, main bot
eval_bots = 0,1

# Ladder rungs run without curriculum noise. Keys are bare [env] names; the
# ladder adds the "env." prefix itself.
[bot_eval]
bot_cl_noise = 0

[env]
num_drones = 2
num_agents = 2
map_idx = -1
enable_teams = 0
is_training = 1

bot_cl_noise = 0.75
bot_cl_decay = 0.001

reward_win = 3.0
reward_life = 1.0
reward_kill = 1.0
reward_self_kill = -1.0
reward_energy_emptied = -0.75
reward_weapon_pickup = 0.5
reward_shield_break = 0.5
reward_hit_coef = 0.005

[train]
total_timesteps = 750_000_000
# learning_rate = 0.005

[sweep]

[sweep.train.total_timesteps]
distribution = log_normal
min = 50_000_000
max = 1_000_000_000
mean = 80_000_000
scale = time

[sweep.env.reward_win]
distribution = uniform
min = 0.0
mean = 2.0
max = 10.0
scale = auto

[sweep.env.reward_life]
distribution = uniform
min = 0.0
mean = 1.0
max = 10.0
scale = auto

[sweep.env.reward_kill]
distribution = uniform
min = 0.0
mean = 1.0
max = 10.0
scale = auto

[sweep.env.reward_self_kill]
distribution = uniform
min = -10.0
mean = -1.0
max = 0.0
scale = auto

[sweep.env.reward_energy_emptied]
distribution = uniform
min = -10.0
mean = -0.75
max = 0.0
scale = auto

[sweep.env.reward_weapon_pickup]
distribution = uniform
min = 0.0
mean = 0.5
max = 10.0
scale = auto

[sweep.env.reward_shield_break]
distribution = uniform
min = 0.0
mean = 0.5
max = 10.0
scale = auto

[sweep.env.reward_hit_coef]
distribution = log_normal
min = 0.0005
mean = 0.005
max = 0.05
scale = auto
