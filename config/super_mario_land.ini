[base]
env_name = super_mario_land

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 8

[policy]
hidden_size = 128
num_layers = 4

[env]
progress_reward = 0.1
coin_reward = 0.3
powerup_reward = 3.0
hit_reward = -0.2
heart_reward = 1.0
level_clear_reward = 1.5
death_reward = -1.5
game_over_reward = -1.0

[train]
total_timesteps = 500_000_000

[sweep]
max_suggestion_cost = 1800

[sweep.train.total_timesteps]
distribution = log_normal
min = 25_000_000
max = 10_000_000_000
scale = time

[sweep.env.progress_reward]
distribution = uniform
min = 0.0
max = 0.5
scale = auto

[sweep.env.coin_reward]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

[sweep.env.powerup_reward]
distribution = uniform
min = 0.0
max = 5.0
scale = auto

[sweep.env.hit_reward]
distribution = uniform
min = -3.0
max = 0.0
scale = auto

[sweep.env.heart_reward]
distribution = uniform
min = 0.0
max = 3.0
scale = auto

[sweep.env.level_clear_reward]
distribution = uniform
min = 0.0
max = 10.0
scale = auto

[sweep.env.death_reward]
distribution = uniform
min = -5.0
max = 0.0
scale = auto

[sweep.env.game_over_reward]
distribution = uniform
min = -10.0
max = 0.0
scale = auto
